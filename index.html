<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCCA POULTRY</title><style>body{margin:0;font:15px system-ui;background:#f5f7f3;color:#183325}header{background:#173d2b;color:white;padding:16px 6%;display:flex;justify-content:space-between}main{max-width:1100px;margin:25px auto;padding:0 16px}.card{background:white;border:1px solid #dfe8df;border-radius:12px;padding:18px;margin:12px 0}input,select,button{padding:10px;border-radius:7px;border:1px solid #cbd8cc;font:inherit}button{background:#25633f;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{background:#fff;border-left:4px solid #d9a62e;padding:15px;border-radius:8px}.kpi b{display:block;font-size:22px}form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e5ebe5;text-align:left}.hide{display:none}.notice{color:#a33;margin:10px 0}</style></head><body><header><b>🐔 LCCA POULTRY</b><span id="who"></span><button id="logout" class="hide">Sign out</button></header><main><section id="auth" class="card"><h1>Manage your farm with confidence</h1><p>Secure poultry records, stock, sales, and profitability.</p><div class="notice" id="msg"></div><form id="authform"><input id="name" placeholder="Your name (when registering)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (6+ characters)" required><button>Sign in</button><button type="button" id="register">Create farm account</button></form></section><section id="app" class="hide"><div class="grid"><div class="kpi"><small>Active birds</small><b id="birds">0</b></div><div class="kpi"><small>Active batches</small><b id="batches">0</b></div><div class="kpi"><small>Total sales</small><b id="sales">₦0</b></div><div class="kpi"><small>Mortality</small><b id="mortality">0</b></div></div><div class="card"><h2>Add a batch</h2><form id="batchform"><input id="batchname" placeholder="Batch name" required><input id="breed" placeholder="Breed / type" required><input id="count" type="number" min="1" placeholder="Birds purchased" required><input id="price" type="number" min="0" placeholder="Price per bird (₦)" required><button>Add batch</button></form></div><div class="card"><h2>Today’s record</h2><form id="recordform"><select id="recordbatch" required></select><input id="deaths" type="number" min="0" value="0" placeholder="Deaths"><input id="sold" type="number" min="0" value="0" placeholder="Birds sold"><input id="saleprice" type="number" min="0" value="0" placeholder="Price per bird (₦)"><button>Save daily record</button></form><p id="recordnote"></p></div><div class="card"><h2>Batch summary</h2><table><thead><tr><th>Batch</th><th>Breed</th><th>Purchased</th><th>Current</th><th>Deaths</th><th>Sold</th><th>Revenue</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,collection,addDoc,doc,setDoc,onSnapshot,query,orderBy}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyA3CcShwFehRNHECGZ_2yungg2zQl2Mejg',authDomain:'zillla-chat.firebaseapp.com',projectId:'zillla-chat',storageBucket:'zillla-chat.appspot.com',messagingSenderId:'101706178591',appId:'1:101706178591:web:92cad5a13012e1e011f52a'}),auth=getAuth(app),db=getFirestore(app);let user,batches=[],records=[];const $=id=>document.getElementById(id),money=n=>'₦'+Number(n||0).toLocaleString('en-NG');function error(e){$('msg').textContent=e.message.replace('Firebase: ','')}$('authform').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(x){error(x)}};$('register').onclick=async()=>{try{let r=await createUserWithEmailAndPassword(auth,$('email').value,$('password').value);await updateProfile(r.user,{displayName:$('name').value||'Farm owner'});await setDoc(doc(db,'farms',r.user.uid),{name:'LCCA POULTRY',ownerId:r.user.uid,createdAt:Date.now()})}catch(x){error(x)}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{user=u;$('auth').classList.toggle('hide',!!u);$('app').classList.toggle('hide',!u);$('logout').classList.toggle('hide',!u);$('who').textContent=u?(u.displayName||u.email):'';if(u){onSnapshot(query(collection(db,'farms',u.uid,'batches'),orderBy('createdAt','desc')),s=>{batches=s.docs.map(d=>({id:d.id,...d.data()}));render()});onSnapshot(collection(db,'farms',u.uid,'records'),s=>{records=s.docs.map(d=>d.data());render()})}});function stat(b){let r=records.filter(x=>x.batchId==b.id),d=r.reduce((n,x)=>n+Number(x.deaths),0),s=r.reduce((n,x)=>n+Number(x.sold),0),rev=r.reduce((n,x)=>n+Number(x.sold)*Number(x.price),0);return{d,s,rev,current:b.count-d-s}}function render(){let totals={birds:0,deaths:0,revenue:0};$('recordbatch').innerHTML='<option value="">Select batch</option>'+batches.map(b=>'<option value="'+b.id+'">'+b.name+'</option>').join('');$('rows').innerHTML=batches.map(b=>{let x=stat(b);totals.birds+=x.current;totals.deaths+=x.d;totals.revenue+=x.rev;return'<tr><td>'+b.name+'</td><td>'+b.breed+'</td><td>'+b.count+'</td><td>'+x.current+'</td><td>'+x.d+'</td><td>'+x.s+'</td><td>'+money(x.rev)+'</td></tr>'}).join('');$('birds').textContent=totals.birds;$('batches').textContent=batches.length;$('sales').textContent=money(totals.revenue);$('mortality').textContent=totals.deaths}$('batchform').onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,'farms',user.uid,'batches'),{name:$('batchname').value,breed:$('breed').value,count:+$('count').value,price:+$('price').value,createdAt:Date.now()});e.target.reset()};$('recordform').onsubmit=async e=>{e.preventDefault();let b=batches.find(x=>x.id==$('recordbatch').value),x=stat(b),d=+$('deaths').value,s=+$('sold').value;if(d+s>x.current){$('recordnote').textContent='This exceeds the available bird population.';return}await addDoc(collection(db,'farms',user.uid,'records'),{batchId:b.id,deaths:d,sold:s,price:+$('saleprice').value,date:Date.now()});$('recordnote').textContent='Saved.';e.target.reset()}</script></body></html>
